.ws .tools{margin-left:auto;display:flex;gap:10px;color:var(--ink2)}
.ws .tools svg{width:15px;height:15px;display:block}
.nav{display:flex;flex-direction:column;gap:1px}
.it{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:6px;color:var(--ink2);font-size:13px;width:100%;text-align:left}
.it svg{width:15px;height:15px;flex:none;opacity:.85}
.it:hover{background:var(--hov)}
.it.on{background:var(--on);color:var(--ink);font-weight:500}
.it .n{margin-left:auto;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec{color:var(--ink3);font-size:11.5px;padding:14px 7px 4px;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.asof{padding:8px 7px;color:var(--ink3);font-size:11.5px;line-height:1.5}
.theme{display:flex;border:1px solid var(--line);border-radius:7px;padding:2px;margin:auto 7px 4px}
.theme button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 0;border-radius:5px;font-size:11.5px;color:var(--ink3)}
.theme button svg{width:13px;height:13px}
.theme button:hover{color:var(--ink2)}
.theme button.on{background:var(--on);color:var(--ink);font-weight:500}
.mtheme{display:none}

/* ── 본문 ── */
main{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;font-size:13.5px;font-weight:500;flex:none}
.top .cnt{color:var(--ink3);font-size:12.5px;font-weight:400}
.bar{display:flex;align-items:center;gap:6px;padding:0 12px 10px;flex-wrap:wrap;flex:none}
.tab{padding:4px 11px;border-radius:7px;color:var(--ink2);font-size:12.5px;border:1px solid transparent}
.tab:hover{background:var(--hov)}
.tab.on{background:var(--on);color:var(--ink);border-color:var(--line);font-weight:500}
.bar .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.fld{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:0 8px;height:28px;background:var(--fld)}
.fld svg{width:14px;height:14px;color:var(--ink3);flex:none}
.fld input{border:0;background:none;font:inherit;font-size:12.5px;color:var(--ink);width:190px;padding:0}
.fld input::placeholder{color:var(--ink3)}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10.5px;color:var(--ink3)}
select{-webkit-appearance:none;appearance:none;border:1px solid var(--line);border-radius:7px;padding:0 24px 0 9px;height:28px;background:var(--fld) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 5l3 3 3-3' fill='none' stroke='%238a8f98' stroke-width='1.6' stroke-linecap='round'/></svg>") no-repeat right 7px center/10px;color:var(--ink2);font:inherit;font-size:12.5px}

/* ── 목록 ── */
.list{overflow:auto;flex:1}
.grp{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--grp);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font-size:12.5px;font-weight:500;position:sticky;top:0;z-index:1}
.grp .n{color:var(--ink3);font-weight:400;font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:0 14px;height:40px;border-bottom:1px solid var(--line2)}
.row:hover{background:var(--hov)}
.pri{display:flex;align-items:flex-end;gap:1.5px;height:11px;width:13px;flex:none}
.pri i{width:3px;border-radius:1px;display:block;background:var(--ink3)}
.pri i:nth-child(1){height:4px}.pri i:nth-child(2){height:7.5px}.pri i:nth-child(3){height:11px}
.pri.u i{background:var(--red)}
.pri.md i:nth-child(3){opacity:.28}
.pri.lo i:nth-child(2),.pri.lo i:nth-child(3){opacity:.28}
.dd{color:var(--ink3);font-size:12.5px;width:46px;flex:none;font-variant-numeric:tabular-nums}
.dd.u{color:var(--red)}
.st{width:14px;height:14px;flex:none}
.t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:60px}
.t:hover{text-decoration:underline}
.right{display:flex;align-items:center;gap:7px;flex:none}
.lbl{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:11px;padding:0 8px;height:21px;font-size:11.5px;color:var(--ink2);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.av{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#0a0a0b;flex:none}
.inst{color:var(--ink2);font-size:12px;width:158px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;flex:none}
.amt{color:var(--ink3);font-size:12px;width:62px;text-align:right;flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt b{color:var(--ink2);font-weight:500}
.date{color:var(--ink3);font-size:12px;width:38px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.empty{padding:56px 20px;text-align:center;color:var(--ink3)}
.pager{display:flex;align-items:center;justify-content:center;gap:4px;padding:16px 14px 28px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.pager button{min-width:30px;height:30px;padding:0 8px;border-radius:6px;border:1px solid transparent;color:var(--ink2)}
.pager button:hover{background:var(--grp)}
.pager button.on{background:var(--acc);color:#fff;font-weight:600}
.pager button:disabled{opacity:.35;cursor:default;background:none}
.pager .gap{padding:0 4px}
.pager .info{margin-left:10px}
.pager select{font:inherit;font-size:12.5px;color:var(--ink2);background:var(--grp);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;margin-left:6px}
@media (max-width:1180px){.inst{display:none}}
@media (max-width:1000px){.lbl.kw{display:none}}

/* ── 키워드 패널 ── */
#panel{display:none;border-bottom:1px solid var(--line);background:var(--grp);flex:none}
#panel.open{display:block}
#panel.admin{background:color-mix(in srgb,var(--amber) 9%,var(--panel))}
.pin{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phd{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phd b{font-size:13px}.phd span{font-size:12px;color:var(--ink3)}
.phd .btn{margin-left:auto}
.pin h2{font-size:12.5px;margin:0 0 3px;font-weight:600}
.pin p{margin:0 0 6px;font-size:12px;color:var(--ink3)}
textarea{width:100%;height:132px;font:inherit;font-size:12.5px;line-height:1.55;border:1px solid var(--line);border-radius:7px;padding:8px 10px;resize:vertical;background:var(--fld);color:var(--ink)}
.act{grid-column:1/-1;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12.5px;background:var(--fld)}
.btn:hover{background:var(--hov)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.msg{font-size:12.5px;color:var(--green)}.msg.err{color:var(--red)}
.tokwrap{margin-left:auto;font-size:12px;color:var(--ink3);cursor:pointer;white-space:nowrap}
.tokwrap.need{color:#0a0a0b;background:var(--amber);border-radius:7px;padding:5px 11px;font-weight:600;font-size:12.5px}
.note{grid-column:1/-1;font-size:11.5px;color:var(--ink3)}

/* ── 모바일 ── */
.mnav{display:none}
/* ── 태블릿 세로 (601~900px): 좁은 아이콘 사이드바 유지 ── */
@media (max-width:900px) and (min-width:601px){
  body{grid-template-columns:56px 1fr;padding:6px}
  aside{padding:8px 6px;top:6px;height:calc(100vh - 12px)}
  .ws{padding:4px 0 12px;justify-content:center}
  .ws .logo{width:22px;height:22px}
  .ws .tools,.ws b{display:none}
  .ws{font-size:0}
  .sec{font-size:0;padding:8px 0 2px;border-top:1px solid var(--line);margin:6px 4px 0}
  .it{justify-content:center;padding:8px 0;gap:0}
  .it .n{display:none}
  .it svg{opacity:1}
  .it[data-tag] .dot{width:9px;height:9px}
  .it[data-tag],.it[data-src]{font-size:10.5px;flex-direction:column;gap:3px;letter-spacing:-.02em}
  .it[data-tag=""]{display:none}
  .it[data-src]{font-size:0}
  .it[data-src] svg{width:15px;height:15px}
  .it[data-view]{font-size:0}
  #btnKw{font-size:0}
  .theme{flex-direction:column;margin:auto 4px 4px;padding:2px}
  .theme button{padding:5px 0;font-size:0}
  .theme button svg{width:14px;height:14px}
  .asof{display:none}
  main{margin:0}
  .inst{display:none}
  .lbl.kw{display:none}
  .fld input{width:150px}
  .bar .tab{padding:4px 9px}
}

/* ── 폰 (~600px): 리니어 모바일처럼 2줄 행 ── */
@media (max-width:600px){
  body{grid-template-columns:1fr;padding:0}
  aside{display:none}
  main{border:0;border-radius:0;min-height:100vh}
  .top{padding:0 12px;height:46px;font-size:16px;font-weight:700;position:sticky;top:0;background:var(--panel);z-index:2}
  .bar{padding:0 12px 8px;gap:6px}
  .fld input{width:100%}
  .fld{flex:1}
  select{padding-right:22px;height:30px}
  .mnav{display:flex;gap:5px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none;flex:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav button{flex:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2);background:var(--fld)}
  .mnav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .mnav button span{opacity:.75;margin-left:4px;font-size:11.5px}
  .bar .tab{display:none}
  .grp{padding:6px 12px}
  /* 행: 1줄 = 막대·D-day·제목 / 2줄 = 기관 · 금액 · 마감 */
  .row{height:auto;display:grid;grid-template-columns:13px 46px 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:3px;padding:9px 12px;align-items:center}
  .pri{grid-row:1;grid-column:1}
  .dd{grid-row:1;grid-column:2}
  .row .st{display:none}
  .t{grid-row:1;grid-column:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
  .right{grid-row:2;grid-column:3;gap:6px;flex-wrap:nowrap;min-width:0;overflow:hidden;font-size:11.5px;color:var(--ink3)}
  .right .lbl{display:none}
  .right .lbl.pre{display:inline-flex;height:17px;padding:0 6px;font-size:10.5px;gap:4px}
  .right .lbl.pre .dot{display:none}
  .right .lbl.new{display:inline-flex;height:17px;padding:0 6px;font-size:10.5px;gap:4px}
  .right .lbl.tag{display:inline-flex;height:17px;padding:0 6px;font-size:10.5px;gap:4px}
  .av{width:15px;height:15px;font-size:8px}
  .inst{display:inline;width:auto;text-align:left;flex:1;min-width:0;font-size:11.5px}
  .amt{width:auto;font-size:11.5px}.date{width:auto;font-size:11.5px}
  .amt::after{content:"";}
  .pin{grid-template-columns:1fr;padding:12px}
  .mtheme{display:inline-block;font-size:15px;padding:2px 9px}
}
</style>

<body>
<aside>
  <div class="ws"><span class="logo"></span>입찰공고
    <span class="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
  </div>
  <div class="nav" id="nav">
    <button class="it" data-view="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h8l-1 8 10-12h-8Z"/></svg>오늘 신규<span class="n" id="n-new"></span></button>
    <button class="it" data-view="urgent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>마감 임박<span class="n" id="n-urgent"></span></button>
    <button class="it on" data-view="matched"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/></svg>관심 공고<span class="n" id="n-matched"></span></button>
    <button class="it" data-view="pre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h5"/></svg>사전규격<span class="n" id="n-pre"></span></button>
    <button class="it" data-view="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>전체<span class="n" id="n-all"></span></button>
    <div class="sec">기관</div>
    <button class="it on" data-tag="">전체 기관</button>

    <button class="it" data-tag="GH"><span class="dot" style="background:var(--acc)"></span>GH<span class="n" id="n-GH"></span></button>
    <button class="it" data-tag="IH"><span class="dot" style="background:var(--purple)"></span>IH<span class="n" id="n-IH"></span></button>
    <button class="it" data-tag="SH"><span class="dot" style="background:var(--orange)"></span>SH<span class="n" id="n-SH"></span></button>
    <div class="sec">키워드</div>
    <button class="it on" data-src="default"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h9"/></svg>회사 기본값<span class="n" id="s-default"></span></button>
    <button class="it" data-src="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 7v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V7Z"/></svg>내 키워드<span class="n" id="s-mine"></span></button>
    <button class="it" id="btnKw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>키워드 편집</button>
  </div>
  <div class="theme" id="theme">
    <button data-theme="auto" title="OS 설정 따라"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>자동</button>
    <button data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>라이트</button>
    <button data-theme="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>다크</button>
  </div>
  <div class="asof">__DATE__ 갱신<br>최근 30일 · <span id="total"></span>건</div>
</aside>

<main>
  <div class="top"><span id="vtitle">관심 공고</span><span class="cnt" id="count"></span>
    <span class="r" style="margin-left:auto"><button class="btn" id="btnKw2" hidden>키워드</button><button class="btn mtheme" id="mTheme" title="테마">◐</button></span>
  </div>
  <div class="bar">
    <button class="tab on" data-cat="">전체</button>

    <button class="tab" data-cat="지자체">지자체</button>
    <button class="tab" data-cat="중앙정부">중앙정부</button>
    <button class="tab" data-cat="교육기관">교육기관</button>
    <span class="r">
      <select id="kind"><option value="">종류: 전체</option><option value="bid">입찰공고</option><option value="pre">사전규격</option></select>
      <select id="open"><option value="1">진행 중</option><option value="">마감 포함</option></select>
      <label class="fld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="공고명, 발주처"><span class="kbd">/</span></label>
    </span>
  </div>
  <div class="mnav" id="mnav"></div>
  <div id="panel"><div class="pin">
    <div class="phd"><b id="pTitle">회사 기본값</b><span id="pDesc"></span><button class="btn" id="btnMode">기본값 편집</button></div>
    <div><h2>포함 키워드</h2><p>공고명에 하나라도 있으면 관심 공고. 한 줄에 하나.</p><textarea id="kwInc"></textarea></div>
    <div><h2>제외 키워드</h2><p>공고명에 있으면 제외. 한 줄에 하나.</p><textarea id="kwExc"></textarea></div>
    <div class="act"><button class="btn p" id="btnSave">저장</button><button class="btn" id="btnReset2">기본값 복사해오기</button><button class="btn" id="btnClose">닫기</button><span class="msg" id="kwMsg"></span><span class="tokwrap" id="btnTok" hidden></span></div>
  </div></div>

</main>

<script>
const DATA=__DATA__;
const DEFAULT_KW=__KW__;
const BUILT="__NOW__";
const CONFIG_HEAD=__CFGHEAD__;
const NOW=new Date(BUILT);
const TODAY=BUILT.slice(0,10);
const LS_KW="bidmon.kw",LS_S="bidmon.filters2";
const VIEWS={new:"오늘 신규",urgent:"마감 임박",matched:"관심 공고",pre:"사전규격",all:"전체 공고"};
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const S=Object.assign({view:"matched",tag:"",q:"",cat:"",kind:"",open:"1",src:"default",per:50},load(LS_S,{}));
let PAGE=1;
let MYKW=load(LS_KW,null);
const EMPTY_KW={include:[],exclude:[]};
const curKW=()=>S.src==="mine"?(MYKW||EMPTY_KW):DEFAULT_KW;
const norm=s=>String(s||"").replace(/\s/g,"");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dday=c=>{if(!c)return null;return Math.floor((new Date(c.replace(" ","T"))-NOW)/864e5);};
/* 발주처는 본부·지사를 떼고 기관명만 */
const shortInst=s=>String(s||"").replace(/\s*\S*(지역본부|지방본부|지역단|본부|지사|출장소|사무소|지원단)\s*$/,"").trim()||String(s||"");
const instOf=n=>{const i=n.institution||"";return (i.includes("조달청")&&n.demand_institution)?n.demand_institution:i;};

function judge(n){const K=curKW();const t=norm(n.title);const inc=K.include.filter(k=>k&&t.includes(norm(k)));const exc=K.exclude.some(k=>k&&t.includes(norm(k)));n.matched=inc.length>0&&!exc;n.mk=[...new Set(inc.map(norm))].join(", ");n.dd=dday(n.close_date);n.isNew=n.first_seen===TODAY;n.isPre=n.notice_kind==="사전규격";}
function judgeAll(){DATA.forEach(judge);}

function base(n){
  if(S.cat&&n.category!==S.cat)return false;
  if(S.kind==="pre"&&!n.isPre)return false;
  if(S.kind==="bid"&&n.isPre)return false;
  if(S.open&&n.dd!==null&&n.dd<0)return false;
  if(S.q){const q=norm(S.q).toLowerCase();if(!norm(n.title+" "+(n.institution||"")+" "+(n.demand_institution||"")).toLowerCase().includes(q))return false;}
  return true;
}
function inView(n,v){
  if(v==="all")return true;
  if(!n.matched)return false;
  if(v==="urgent")return n.dd!==null&&n.dd>=0&&n.dd<=7;
  if(v==="new")return n.isNew;
  if(v==="pre")return n.isPre;
  return true;
}
const hasTag=(n,t)=>!t||(n.tags||"").split(",").includes(t);

function counts(){
  const b=DATA.filter(base);
  for(const v of Object.keys(VIEWS))$("n-"+v).textContent=b.filter(n=>inView(n,v)&&hasTag(n,S.tag)).length.toLocaleString();
  for(const t of ["LH","GH","IH","SH"])$("n-"+t).textContent=b.filter(n=>inView(n,S.view)&&hasTag(n,t)).length||"";
  $("total").textContent=DATA.length.toLocaleString();
}

const TAGC={LH:"var(--green)",GH:"var(--acc)",IH:"var(--purple)",SH:"var(--orange)"};
const CATC={"공공기관":["공","#4cb782"],"지자체":["지","#4ea7fc"],"교육기관":["교","#f2c94c"],"중앙정부":["중","#a78bfa"],"기타":["기","#8a8f98"]};
const ICO={
 u:'<svg class="st" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--red)" stroke-width="1.6"/><path d="M8 8V4.2" stroke="var(--red)" stroke-width="1.6" stroke-linecap="round"/><path d="M8 8l2.6 1.6" stroke="var(--red)" stroke-width="1.6" stroke-linecap="round"/></svg>',
 m:'<svg class="st" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="2.2 2.2"/><circle cx="8" cy="8" r="2.6" fill="var(--amber)"/></svg>',
 l:'<svg class="st" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--ink3)" stroke-width="1.6"/></svg>',
 p:'<svg class="st" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="var(--blue)" stroke-width="1.5"/><path d="M5 6.5h6M5 9.5h4" stroke="var(--blue)" stroke-width="1.5" stroke-linecap="round"/></svg>',
 x:'<svg class="st" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--ink3)" stroke-width="1.6" stroke-dasharray="1.5 2.5"/></svg>'};

function rowHTML(n){
  const d=n.dd;
  const cls=d===null?"lo":d<=3?"u":d<=7?"md":"lo";
  const st=n.isPre?ICO.p:(d===null?ICO.x:d<=3?ICO.u:d<=7?ICO.m:ICO.l);
  const ddtxt=d===null?"—":d<0?"마감":"D-"+d;
  const [ch,cc]=CATC[n.category]||CATC["기타"];
  const amt=(n.estimated_price||n.budget)?`<b>${Math.round((n.estimated_price||n.budget)/1e6).toLocaleString()}</b>백만`:"";
  let title;
  if(n.url)title=`<a class="t" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>`;
  else if(n.isPre)title=`<a class="t" href="https://www.g2b.go.kr/" target="_blank" rel="noopener" data-copy="${esc(n.notice_no||"")}" title="클릭하면 등록번호를 복사하고 나라장터를 엽니다">${esc(n.title)}</a>`;
  else title=`<span class="t">${esc(n.title)}</span>`;
  return `<div class="row">
    <span class="pri ${cls}"><i></i><i></i><i></i></span>
    <span class="dd${d!==null&&d>=0&&d<=3?' u':''}">${ddtxt}</span>
    ${st}${title}
    <span class="right">
      ${n.isNew?'<span class="lbl new"><span class="dot" style="background:var(--acc)"></span>NEW</span>':''}
      ${n.isPre?'<span class="lbl pre"><span class="dot" style="background:var(--blue)"></span>사전규격</span>':''}
      ${(n.tags||"").split(",").filter(Boolean).map(t=>`<span class="lbl tag"><span class="dot" style="background:${TAGC[t]}"></span>${t}</span>`).join("")}
      ${n.mk?`<span class="lbl kw">${esc(n.mk.split(", ")[0])}</span>`:""}
      <span class="av" style="background:${cc}" title="${esc(n.category||"")}">${ch}</span>
      <span class="inst" title="${esc(instOf(n))}">${esc(shortInst(instOf(n)))}</span>
      <span class="amt">${amt}</span>
      <span class="date">${n.close_date?n.close_date.slice(5,10):""}</span>
    </span></div>`;
}

function render(){
  counts();
  const rows=DATA.filter(n=>base(n)&&inView(n,S.view)&&hasTag(n,S.tag));
  $("vtitle").textContent=VIEWS[S.view]+(S.tag?" · "+S.tag:"")+(S.cat?" · "+S.cat:"");
  $("count").textContent=rows.length.toLocaleString();
  const el=$("list");
  if(!rows.length){
    el.innerHTML='<div class="empty">'+((S.src==="mine"&&!MYKW&&S.view!=="all")?"내 키워드가 비어 있습니다. 왼쪽 [키워드 편집]에서 키워드를 넣어 주세요.":"조건에 맞는 공고가 없습니다.")+'</div>';
    return;
  }
  const g=[[],[],[],[]];   // 이번 주 / 다음 주 / 이후 / 마감일 없음
  for(const n of rows){
    const d=n.dd;
    if(d===null)g[3].push(n); else if(d<=6)g[0].push(n); else if(d<=13)g[1].push(n); else g[2].push(n);
  }
  const bySoon=(a,b)=>(a.dd??9e9)-(b.dd??9e9)||(b.notice_date||"").localeCompare(a.notice_date||"");
  const byNew=(a,b)=>(b.notice_date||"").localeCompare(a.notice_date||"");
  const GR=[["u","이번 주 마감",bySoon],["m","다음 주",bySoon],["l","이후",bySoon],["x","마감일 없음",byNew]];
  const ordered=[];
  GR.forEach(([ico,label,sorter],gi)=>{g[gi].sort(sorter).forEach(n=>ordered.push([gi,n]));});
  // 페이지 나누기
  const per=Math.max(10,+S.per||50), pages=Math.max(1,Math.ceil(ordered.length/per));
  if(PAGE>pages)PAGE=pages; if(PAGE<1)PAGE=1;
  const slice=ordered.slice((PAGE-1)*per,PAGE*per);
  let html="",last=-1;
  for(const [gi,n] of slice){
    if(gi!==last){const [ico,label]=GR[gi];html+=`<div class="grp">${ICO[ico]}${label}<span class="n">${g[gi].length.toLocaleString()}</span></div>`;last=gi;}
    html+=rowHTML(n);
  }
  el.innerHTML=html+pagerHTML(pages,ordered.length,per);
  el.scrollTop=0;
}
function pagerHTML(pages,total,per){
  if(pages<=1&&total<=per)return "";
  const b=(n,l,dis,on)=>`<button data-page="${n}" ${dis?"disabled":""} class="${on?"on":""}">${l}</button>`;
  let nums=[];const set=new Set([1,pages,PAGE-1,PAGE,PAGE+1,PAGE-2,PAGE+2].filter(x=>x>=1&&x<=pages));
  [...set].sort((a,b)=>a-b).forEach((n,i,arr)=>{if(i&&n-arr[i-1]>1)nums.push('<span class="gap">…</span>');nums.push(b(n,n,false,n===PAGE));});
  const from=(PAGE-1)*per+1,to=Math.min(PAGE*per,total);
  return `<div class="pager">${b(PAGE-1,"‹",PAGE<=1)}${nums.join("")}${b(PAGE+1,"›",PAGE>=pages)}
    <span class="info">${from.toLocaleString()}–${to.toLocaleString()} / ${total.toLocaleString()}건</span>
    <select id="per">${[25,50,100,200].map(v=>`<option value="${v}" ${v===per?"selected":""}>${v}개씩</option>`).join("")}</select></div>`;
}

function syncUI(){
  document.querySelectorAll("#nav [data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===S.view));
  document.querySelectorAll("#nav [data-tag]").forEach(b=>b.classList.toggle("on",b.dataset.tag===S.tag));
  document.querySelectorAll(".bar [data-cat]").forEach(b=>b.classList.toggle("on",b.dataset.cat===S.cat));
  syncSrc();
  $("q").value=S.q;$("kind").value=S.kind;$("open").value=S.open;
  $("mnav").innerHTML=Object.entries(VIEWS).map(([v,l])=>`<button data-view="${v}" class="${v===S.view?'on':''}">${l}<span>${$("n-"+v).textContent}</span></button>`).join("")
    +["LH","GH","IH","SH"].map(t=>`<button data-tag="${t}" class="${t===S.tag?'on':''}">${t}</button>`).join("")
    +`<button data-kw="1">키워드</button>`;
}
function fillKw(){const K=curKW();$("kwInc").value=K.include.join("\n");$("kwExc").value=K.exclude.join("\n");}
function syncSrc(){
  document.querySelectorAll("#nav [data-src]").forEach(b=>b.classList.toggle("on",b.dataset.src===S.src));
  $("s-default").textContent=S.src==="default"?"사용 중":"";
  $("s-mine").textContent=S.src==="mine"?"사용 중":(MYKW?"저장됨":"미설정");
  if(!ADMIN){
    $("pTitle").textContent=S.src==="mine"?"내 키워드":"회사 기본값";
    $("pDesc").textContent=S.src==="mine"?(MYKW?"이 브라우저에만 저장됩니다.":"아직 비어 있습니다. 직접 입력하거나 [기본값 복사해오기].") :"모두가 함께 쓰는 값입니다. 고치려면 [기본값 편집].";
  }
}
function update(){PAGE=1;save(LS_S,S);render();syncUI();}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(b&&b.dataset.page!==undefined){PAGE=+b.dataset.page;render();return;}
  if(b&&b.dataset.src!==undefined){S.src=b.dataset.src;save(LS_S,S);fillKw();judgeAll();update();return;}

  if(b&&b.dataset.tag!==undefined){S.tag=(S.tag===b.dataset.tag&&b.closest("#mnav"))?"":b.dataset.tag;update();return;}
  if(b&&b.dataset.cat!==undefined){S.cat=b.dataset.cat;update();return;}
  if(b&&b.dataset.kw!==undefined){togglePanel();return;}
  const a=e.target.closest("a[data-copy]");
  if(a){navigator.clipboard&&navigator.clipboard.writeText(a.dataset.copy).catch(()=>{});const c=$("count"),o=c.textContent;c.textContent="등록번호 복사됨 — 나라장터에 붙여넣기";setTimeout(()=>c.textContent=o,4000);}
});
document.addEventListener("change",e=>{if(e.target.id==="per"){S.per=+e.target.value;update();}});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){S.q=$("q").value;update();}});
$("q").addEventListener("search",()=>{if(!$("q").value){S.q="";update();}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();$("q").focus();}});
for(const id of ["kind","open"])$(id).addEventListener("change",()=>{S[id]=$(id).value;update();});
const togglePanel=()=>{$("panel").classList.toggle("open");};
$("btnKw").onclick=togglePanel;$("btnKw2").onclick=togglePanel;
$("btnClose").onclick=()=>{if(ADMIN)setMode(false);$("panel").classList.remove("open");};
$("btnSave").onclick=()=>{
  if(ADMIN){saveDefaults();return;}
  MYKW=readBoxes();save(LS_KW,MYKW);S.src="mine";save(LS_S,S);
  judgeAll();render();syncUI();
  $("kwMsg").className="msg";$("kwMsg").textContent="저장됨";
  setTimeout(()=>$("kwMsg").textContent="",3000);
};
$("btnReset2").onclick=()=>{
  $("kwInc").value=DEFAULT_KW.include.join("\n");$("kwExc").value=DEFAULT_KW.exclude.join("\n");
  $("kwMsg").className="msg";$("kwMsg").textContent="기본값을 가져왔습니다 — 고친 뒤 [저장]";setTimeout(()=>$("kwMsg").textContent="",4000);
};

/* ── 기본값 편집 모드 (비밀번호를 아는 사람 누구나) ── */
const ADMIN_HASH="__ADMIN_HASH__";
const GH_REPO="__GH_REPO__", GH_PATH="__GH_PATH__";
let TOKEN_ENC="__TOKEN_ENC__";
let ADMIN=false, DRAFT=null, TOKEN="", HEAD=CONFIG_HEAD||"";

const enc=new TextEncoder(), dec=new TextDecoder();
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",enc.encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const toB64=u8=>btoa(String.fromCharCode(...u8));
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw,salt){
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function lock(text,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFrom(pw,salt),enc.encode(text)));
  return [toB64(salt),toB64(iv),toB64(ct)].join(".");
}
async function unlock(blob,pw){
  const [s1,s2,s3]=blob.split(".");
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(s2)},await keyFrom(pw,fromB64(s1)),fromB64(s3));
  return dec.decode(pt);
}
const readBoxes=()=>({include:$("kwInc").value.split("\n").map(s=>s.trim()).filter(Boolean),exclude:$("kwExc").value.split("\n").map(s=>s.trim()).filter(Boolean)});
function setMode(on){
  ADMIN=on;
  $("panel").classList.toggle("admin",on);
  $("pTitle").textContent=on?"기본값 (모두에게 적용)":"내 관심 키워드";
  $("pDesc").textContent=on?"저장하면 바로 적용됩니다 (다른 분은 새로고침).":"이 브라우저에만 저장됩니다.";
  $("btnMode").textContent=on?"내 키워드로 돌아가기":"기본값 편집";
  $("btnSave").textContent=on?"기본값 저장":"저장";
  $("btnReset2").hidden=on||S.src!=="mine";$("btnTok").hidden=!on;
  updTok();
  if(on){DRAFT=readBoxes();$("kwInc").value=DEFAULT_KW.include.join("\n");$("kwExc").value=DEFAULT_KW.exclude.join("\n");}
  else{const d=DRAFT||curKW();$("kwInc").value=d.include.join("\n");$("kwExc").value=d.exclude.join("\n");DRAFT=null;TOKEN="";syncSrc();}
}
let PW="";
$("btnMode").onclick=async()=>{
  if(ADMIN){setMode(false);return;}
  const pw=prompt("기본값 편집 — 비밀번호");
  if(pw===null)return;
  if(await sha256(pw)!==ADMIN_HASH){alert("비밀번호가 맞지 않습니다.");return;}
  PW=pw; TOKEN="";
  if(TOKEN_ENC){try{TOKEN=await unlock(TOKEN_ENC,pw);}catch(e){}}
  setMode(true);
};
function updTok(){const e=$("btnTok");e.textContent=TOKEN?"GitHub 연결됨 ✓":"GitHub 연결 필요";e.classList.toggle("need",!TOKEN);}
$("btnTok").onclick=async()=>{
  const t=prompt("GitHub 토큰을 붙여넣으세요.\n한 번만 등록하면, 이후에는 비밀번호를 아는 누구나 저장할 수 있습니다.\n\ngithub.com → Settings → Developer settings →\nFine-grained tokens → bid-monitor / Contents: Read and write",TOKEN);
  if(t===null||!t.trim())return;
  TOKEN=t.trim(); TOKEN_ENC=await lock(TOKEN,PW);
  updTok();
  $("kwMsg").className="msg";$("kwMsg").textContent="토큰 등록됨 — 저장을 누르면 함께 반영됩니다";
};
function buildYaml(){
  const {include:inc,exclude:exc}=readBoxes();
  let head=HEAD.replace(/\r/g,"").replace(/^admin_token_enc:.*\n/m,"");
  if(TOKEN_ENC)head=head.replace(/(admin_password:.*\n)/,"$1admin_token_enc: "+TOKEN_ENC+"\n");
  return head+"filters:\n  include_keywords:\n"+inc.map(k=>"    - "+k+"\n").join("")
    +"  exclude_keywords:\n"+exc.map(k=>"    - "+k+"\n").join("");
}
function download(y){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([y],{type:"text/yaml;charset=utf-8"}));
  a.download="config.yaml";a.click();URL.revokeObjectURL(a.href);
}
const b64=str=>btoa(String.fromCharCode(...enc.encode(str)));
async function saveDefaults(){
  const y=buildYaml();
  if(!TOKEN){alert("GitHub 연결이 필요합니다. [GitHub 연결 필요]를 눌러 토큰을 한 번 등록해 주세요.");return;}
  const msg=$("kwMsg"); msg.className="msg"; msg.textContent="저장 중…";
  const H={Authorization:"Bearer "+TOKEN,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  const url=`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`;
  try{
    let lastErr="";
    for(let i=0;i<3;i++){
      const cur=await fetch(url+"?ref=main&t="+Date.now(),{headers:H,cache:"no-store"});
      if(cur.status===401||cur.status===403)throw new Error("토큰이 거부되었습니다. 권한(Contents: Read and write)과 만료일을 확인하세요.");
      const sha=cur.ok?(await cur.json()).sha:undefined;
      const put=await fetch(url,{method:"PUT",headers:{...H,"Content-Type":"application/json"},
        body:JSON.stringify({message:"기본값 수정 (페이지에서)",content:b64(y),sha,branch:"main"})});
      if(put.ok){
        HEAD=y.split("filters:")[0];
        applyDefaults(readBoxes(),false);
        msg.textContent=S.src==="default"?"저장됨":"저장됨 — 지금 화면은 [내 키워드] 사용 중";
        setTimeout(()=>msg.textContent="",3000);
        return;
      }
      lastErr="("+put.status+") "+(await put.text()).slice(0,100);
      if(put.status!==409)break;
      await new Promise(r=>setTimeout(r,700));
    }
    throw new Error("저장 실패 "+lastErr);
  }catch(e){
    msg.className="msg err";
    msg.textContent=String(e.message||e)+" · 파일로 대신 내려받습니다";
    download(y);
  }
}
function applyDefaults(kw,refill=true){
  DEFAULT_KW.include=kw.include.slice(); DEFAULT_KW.exclude=kw.exclude.slice();
  if(S.src!=="default")return;
  if(refill&&!ADMIN)fillKw();
  judgeAll();render();syncUI();
}
/* 페이지를 열 때 최신 기본값을 GitHub 에서 직접 읽어옴 */
(async()=>{
  if(!GH_REPO||!GH_PATH)return;
  try{
    const r=await fetch(`https://raw.githubusercontent.com/${GH_REPO}/main/${GH_PATH}?t=`+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const txt=await r.text();
    const grab=(name)=>{
      const m=txt.match(new RegExp("\\n  "+name+":\\n([\\s\\S]*?)(?=\\n  \\w|\\n\\w|$)"));
      return m?m[1].split("\n").map(l=>l.trim()).filter(l=>l.startsWith("- ")).map(l=>l.slice(2).trim().replace(/^["']|["']$/g,"")):null;
    };
    const inc=grab("include_keywords"), exc=grab("exclude_keywords");
    if(inc&&exc&&inc.length&&(inc.join("|")!==DEFAULT_KW.include.join("|")||exc.join("|")!==DEFAULT_KW.exclude.join("|"))){
      applyDefaults({include:inc,exclude:exc});
    }
  }catch(e){}
})();
/* ── 테마: 자동 / 라이트 / 다크 ── */
const LS_TH="bidmon.theme";
function getTheme(){try{return localStorage.getItem(LS_TH)||"auto";}catch(e){return "auto";}}
function setTheme(t){
  try{t==="auto"?localStorage.removeItem(LS_TH):localStorage.setItem(LS_TH,t);}catch(e){}
  if(t==="auto")delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t;
  document.querySelectorAll("#theme button").forEach(b=>b.classList.toggle("on",b.dataset.theme===t));
  $("mTheme").textContent=t==="light"?"☀":t==="dark"?"☾":"◐";
}
$("theme").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setTheme(b.dataset.theme);});
$("mTheme").onclick=()=>{const o=["auto","light","dark"];setTheme(o[(o.indexOf(getTheme())+1)%3]);};
setTheme(getTheme());
fillKw();judgeAll();render();syncUI();
</script>
