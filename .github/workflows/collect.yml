name: 입찰공고 수집

# PC 없이 GitHub 에서만 수집·배포합니다. 수동 실행: Actions 탭 → 입찰공고 수집 → Run workflow
on:
  schedule:
    # GitHub 예약은 매시 정각·05분처럼 전 세계가 몰리는 시각에 많이 건너뜁니다 → 일부러 어중간한 분(17·47분)으로 분산
    - cron: "13 22 * * *"                         # 매일 07:13 KST → 최근 7일 (하루 한 번 넓게 훑어 누락 보정)
    - cron: "17,47 23,0-9 * * 1-5"                # 평일 08:17~18:47 KST 30분마다 → 최근 3일 (증분)
    - cron: "17 1,5 * * 0,6"                      # 주말 10:17, 14:17 KST → 최근 3일
  workflow_dispatch:
    inputs:
      days:
        description: "수집 범위(일). 비우면 증분(3일). 며칠 빠졌으면 그 일수+2, 전체 재수집은 30 (약 1시간)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: bid-monitor-github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bid-monitor-github/requirements.txt
      - run: pip install -r requirements.txt

      - name: 필수 비밀값 확인
        env:
          G2B: ${{ secrets.G2B_SERVICE_KEY }}
          KEY: ${{ secrets.ACCESS_PRIVATE_KEY }}
          TOK: ${{ secrets.STATE_TOKEN }}
        run: |
          [ -n "$G2B" ] || { echo "::error::Secret G2B_SERVICE_KEY 없음 (Settings → Secrets and variables → Actions)"; exit 1; }
          [ -n "$KEY" ] || echo "::warning::Secret ACCESS_PRIVATE_KEY 없음 — 부서 잠금/관리자 [부서 관리]가 동작하지 않을 수 있음"
          [ -n "$TOK" ] || echo "::warning::Secret STATE_TOKEN 없음 — 부서 관심공고·키워드 공유 저장이 꺼짐"

      - name: 수집 (실패 시 3분 후 재시도, 최대 3회)
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          ACCESS_PRIVATE_KEY: ${{ secrets.ACCESS_PRIVATE_KEY }}
          ACCESS_PASSWORDS: ${{ secrets.ACCESS_PASSWORDS }}
          GITHUB_TOKEN: ${{ secrets.STATE_TOKEN }}
          # 수동 실행은 입력값, 07:00 예약 실행은 7일, 그 외 예약은 비움(3일 증분)
          BIDMON_DAYS: ${{ github.event.inputs.days || (github.event.schedule == '13 22 * * *' && '7') || '' }}
          BIDMON_INFO_MAX: "80"            # 한 번에 공고문(첨부)을 읽을 공고 수 — 밀린 공고가 많을 때 빨리 비움
          TZ: Asia/Seoul
        run: |
          set -o pipefail
          for i in 1 2 3; do
            if python build.py 2>&1 | tee /tmp/build.log && ! grep -q "수집 결과 0건" /tmp/build.log; then break; fi
            echo "::warning::수집 실패 ($i/3) — 3분 후 재시도"
            if [ $i -eq 3 ]; then echo "::error::3회 모두 실패. 이전 페이지 유지."; exit 1; fi
            sleep 180
          done
          {
            echo "### 수집 결과"
            grep -E "건|수집|WARNING|ERROR" /tmp/build.log | tail -40
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 페이지 복사 및 커밋
        run: |
          mkdir -p ../docs
          for f in docs/*; do [ "$(basename "$f")" = "seen.json" ] || cp -r "$f" ../docs/; done
          git config user.name "bid-bot"
          git config user.email "bid-bot@users.noreply.github.com"
          git add docs/ ../docs/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "공고 갱신 $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 15
          done
          exit 1
